name: nightly-live

# Builds the Linux native binary and runs it against live Yahoo. Checks JSON shape, never values.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: true

jobs:
  live-smoke:
    name: live smoke (native, linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # tests run in ci.yml; this job only needs the binary
      - name: Build native image
        run: ./mvnw --batch-mode --no-transfer-progress -Pnative package -DskipTests

      - name: Live smoke
        run: scripts/live-smoke.sh target/yfin
