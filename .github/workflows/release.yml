name: release

# A vX.Y.Z tag builds the native binaries, publishes the GitHub release and updates the tap.
# workflow_dispatch with dry_run builds and smoke-tests all targets and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z, without the v)"
        required: true
        default: "0.0.0-dryrun"
      dry_run:
        description: "Build and smoke-test only; no release, no tap push"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${VERSION#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "not a release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # tests already ran in ci.yml on this commit
      - name: Build native image
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Pnative package -DskipTests
          -Drevision=${{ steps.version.outputs.version }}

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          out=$(target/yfin --version)
          echo "$out"
          grep -qx "yfin ${{ steps.version.outputs.version }}" <<<"$out"
          target/yfin --help >/dev/null

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="yfin-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist stage
          cp target/yfin LICENSE NOTICE stage/
          tar -czf "dist/$name" -C stage yfin LICENSE NOTICE
          tar -tzf "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yfin-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum yfin-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "yfin ${VERSION#v}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7

  tap:
    name: Homebrew tap
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      - uses: actions/checkout@v4
        with:
          repository: andreygrigoriev/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS

      - name: Render formula
        run: |
          mkdir -p tap/Formula
          cli/packaging/homebrew/render-formula.sh "${VERSION#v}" SHA256SUMS > tap/Formula/yfin.rb
          ruby -c tap/Formula/yfin.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yfin.rb
          git commit -m "yfin ${VERSION#v}"
          git push
